services:
  kg-ai-app:
    build:
      context: .
      dockerfile: Dockerfile.v3
    container_name: kg-ai-app
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kg_users
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - MONGODB_URI=mongodb://root:root@mongo:27017/
      - MONGODB_DATABASE=kg_chat_history
      - MONGODB_USERNAME=root
      - MONGODB_PASSWORD=root
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=root
      - NEO4J_DATABASE=neo4j
    depends_on:
      - postgres
      - mongo
      - neo4j

  neo4j:
    image: neo4j:5.26.8-community
    container_name: kg-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/root
      - NEO4J_dbms_security_auth__minimum__password__length=4
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:17.7-alpine3.23
    container_name: kg-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=kg_users
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:8.0.17-noble
    container_name: kg-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
      - MONGO_INITDB_DATABASE=kg_chat_history
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:
