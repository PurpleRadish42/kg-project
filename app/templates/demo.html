<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Graph AI - Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out;
        }

        .paragraph-section {
            margin-bottom: 2rem;
        }

        .paragraph-section h2 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .paragraph-text {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 12px;
            line-height: 1.8;
            color: #555;
            border-left: 4px solid #667eea;
            font-size: 1.05rem;
        }

        .store-button {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .store-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .store-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.2rem;
            font-weight: 500;
        }

        .questions-section {
            display: none;
            animation: fadeInUp 0.8s ease-out;
        }

        .questions-section.active {
            display: block;
        }

        .questions-section h2 {
            color: #667eea;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .question-item {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .question-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #333;
            flex: 1;
        }

        .answer-button {
            padding: 0.6rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .answer-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .answer-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .answer-content {
            margin-top: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .answer-content.active {
            display: block;
        }

        .answer-text {
            color: #555;
            line-height: 1.6;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            border-left: 4px solid #28a745;
        }

        .success-message.active {
            display: flex;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }
            to {
                opacity: 1;
                max-height: 500px;
            }
        }

        .loading-mini {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .card {
                padding: 1.5rem;
            }

            .question-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .answer-button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-brain"></i> Knowledge Graph AI</h1>
            <p>Extract, Store, and Query Knowledge from Natural Language</p>
        </div>

        <div class="card">
            <div class="paragraph-section">
                <h2><i class="fas fa-file-alt"></i> Context Paragraph</h2>
                <div class="paragraph-text">{{ paragraph }}</div>
            </div>

            <button class="store-button" id="storeBtn" onclick="storeData()">
                <i class="fas fa-database"></i> Store Data in Knowledge Graph
            </button>
        </div>

        <div class="card questions-section" id="questionsSection">
            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i>
                <span>Data successfully extracted and stored in Neo4j!</span>
            </div>

            <h2><i class="fas fa-question-circle"></i> Ask Questions</h2>
            
            {% for question in questions %}
            <div class="question-item">
                <div class="question-header">
                    <div class="question-text">{{ question }}</div>
                    <button class="answer-button" onclick="getAnswer({{ loop.index0 }}, '{{ question }}')">
                        <i class="fas fa-search"></i> Answer
                    </button>
                </div>
                <div class="answer-content" id="answer-{{ loop.index0 }}">
                    <div class="answer-text"></div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Processing...</div>
        </div>
    </div>

    <script>
        async function storeData() {
            const storeBtn = document.getElementById('storeBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            const questionsSection = document.getElementById('questionsSection');
            const successMessage = document.getElementById('successMessage');

            // Disable button and show loading
            storeBtn.disabled = true;
            storeBtn.innerHTML = '<div class="loading-mini"></div> Storing...';
            loadingOverlay.classList.add('active');
            loadingText.textContent = 'Extracting knowledge from text...';

            try {
                // Store data via API
                const response = await fetch('/api/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: `{{ paragraph }}`
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to store data');
                }

                const result = await response.json();

                // Update loading text
                loadingText.textContent = 'Storing in Neo4j database...';
                await new Promise(resolve => setTimeout(resolve, 1000));

                loadingText.textContent = 'Success! Data stored.';
                await new Promise(resolve => setTimeout(resolve, 500));

                // Hide loading overlay
                loadingOverlay.classList.remove('active');

                // Show success message
                successMessage.classList.add('active');

                // Show questions section
                questionsSection.classList.add('active');

                // Update button
                storeBtn.innerHTML = '<i class="fas fa-check"></i> Data Stored Successfully';
                storeBtn.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';

                // Smooth scroll to questions
                setTimeout(() => {
                    questionsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 300);

            } catch (error) {
                console.error('Error:', error);
                loadingOverlay.classList.remove('active');
                storeBtn.disabled = false;
                storeBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error - Try Again';
                storeBtn.style.background = 'linear-gradient(135deg, #dc3545 0%, #c82333 100%)';
                alert('Error storing data. Please make sure Neo4j is running and try again.');
            }
        }

        async function getAnswer(index, question) {
            const answerContent = document.getElementById(`answer-${index}`);
            const answerText = answerContent.querySelector('.answer-text');
            const button = event.target.closest('.answer-button');

            // If answer already shown, hide it
            if (answerContent.classList.contains('active')) {
                answerContent.classList.remove('active');
                button.innerHTML = '<i class="fas fa-search"></i> Answer';
                return;
            }

            // Show loading state
            button.disabled = true;
            button.innerHTML = '<div class="loading-mini"></div> Loading...';

            try {
                // Query API
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to get answer');
                }

                const result = await response.json();

                // Show answer
                answerText.textContent = result.answer;
                answerContent.classList.add('active');
                button.innerHTML = '<i class="fas fa-eye-slash"></i> Hide';

            } catch (error) {
                console.error('Error:', error);
                alert('Error fetching answer. Please try again.');
                button.innerHTML = '<i class="fas fa-search"></i> Answer';
            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
