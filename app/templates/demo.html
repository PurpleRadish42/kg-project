<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo - KG AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Tiempos+Text:wght@400;600&display=swap"
        rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        .demo-card {
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .demo-card h2 {
            font-family: var(--font-serif);
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .demo-card h2 i {
            color: var(--accent-color);
        }

        .paragraph-text {
            background: var(--bg-color);
            padding: 1.5rem;
            border-radius: 8px;
            line-height: 1.8;
            color: var(--text-primary);
            border-left: 4px solid var(--accent-color);
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        .store-button {
            width: 100%;
            padding: 1rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .store-button:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .store-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .questions-section {
            display: none;
        }

        .questions-section.active {
            display: block;
        }

        .question-item {
            background: var(--bg-color);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .question-item:hover {
            border-color: var(--accent-color);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .question-text {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            flex: 1;
        }

        .answer-button {
            padding: 0.6rem 1.2rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .answer-button:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .answer-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .answer-content {
            margin-top: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
            display: none;
        }

        .answer-content.active {
            display: block;
        }

        .answer-text {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            border-left: 4px solid #28a745;
        }

        .success-message.active {
            display: flex;
        }

        .loading-mini {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @media (max-width: 768px) {
            .question-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .answer-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar with only Home link -->
        <aside class="sidebar">
            <a class="sidebar-brand" href="{{ url_for('web.index') }}">
                <i class="fas fa-cube"></i> KG AI
            </a>

            <nav class="nav-links">
                <a class="nav-item" href="{{ url_for('web.index') }}">
                    <i class="fas fa-home"></i> Home
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container-fluid">
                <div class="row mb-4">
                    <div class="col">
                        <h1><i class="fas fa-flask me-3"></i>Demo</h1>
                        <p class="text-muted">Try the knowledge graph system with a pre-filled example</p>
                    </div>
                </div>

                <div class="demo-card">
                    <h2><i class="fas fa-file-alt"></i>Context Paragraph</h2>
                    <div class="paragraph-text">{{ paragraph }}</div>
                    <button class="store-button" id="storeBtn" onclick="storeData()">
                        <i class="fas fa-database"></i> Store Data in Knowledge Graph
                    </button>
                </div>

                <div class="demo-card questions-section" id="questionsSection">
                    <div class="success-message" id="successMessage">
                        <i class="fas fa-check-circle"></i>
                        <span>Data successfully extracted and stored in Neo4j!</span>
                    </div>

                    <h2><i class="fas fa-question-circle"></i>Ask Questions</h2>

                    {% for question in questions %}
                    <div class="question-item">
                        <div class="question-header">
                            <div class="question-text">{{ question }}</div>
                            <button class="answer-button" data-index="{{ loop.index0 }}"
                                data-question="{{ question|replace("'", "&apos;")|replace('"', " &quot;") }}">
                                <i class="fas fa-search me-1"></i> Answer
                            </button>
                        </div>
                        <div class="answer-content" id="answer-{{ loop.index0 }}">
                            <div class="answer-text"></div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </main>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Processing...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function storeData() {
            const storeBtn = document.getElementById('storeBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            const questionsSection = document.getElementById('questionsSection');
            const successMessage = document.getElementById('successMessage');

            // Disable button and show loading
            storeBtn.disabled = true;
            storeBtn.innerHTML = '<div class="loading-mini"></div> Storing...';
            loadingOverlay.classList.add('active');
            loadingText.textContent = 'Extracting knowledge from text...';

            try {
                // Store data via API
                const response = await fetch('/api/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: `{{ paragraph }}`
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ error: 'Unknown error' }));
                    throw new Error(errorData.error || 'Failed to store data');
                }

                const result = await response.json();

                // Update loading text
                loadingText.textContent = 'Storing in Neo4j database...';
                await new Promise(resolve => setTimeout(resolve, 1000));

                loadingText.textContent = 'Success! Data stored.';
                await new Promise(resolve => setTimeout(resolve, 500));

                // Hide loading overlay
                loadingOverlay.classList.remove('active');

                // Show success message
                successMessage.classList.add('active');

                // Show questions section
                questionsSection.classList.add('active');

                // Update button
                storeBtn.innerHTML = '<i class="fas fa-check"></i> Data Stored Successfully';
                storeBtn.style.backgroundColor = '#28a745';

                // Smooth scroll to questions
                setTimeout(() => {
                    questionsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 300);

            } catch (error) {
                console.error('Error:', error);
                loadingOverlay.classList.remove('active');

                const errorMessage = error.message || 'Error storing data. Please check the console for details.';

                storeBtn.disabled = false;
                storeBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error - Try Again';
                storeBtn.style.backgroundColor = '#dc3545';
                alert(errorMessage + '\n\nCheck browser console (F12) for more details.');
            }
        }

        // Add click handlers to all answer buttons
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.answer-button').forEach(button => {
                button.addEventListener('click', function () {
                    const index = this.dataset.index;
                    const question = this.dataset.question;
                    getAnswer(index, question, this);
                });
            });
        });

        async function getAnswer(index, question, button) {
            const answerContent = document.getElementById(`answer-${index}`);
            const answerText = answerContent.querySelector('.answer-text');

            // If answer already shown, hide it
            if (answerContent.classList.contains('active')) {
                answerContent.classList.remove('active');
                button.innerHTML = '<i class="fas fa-search me-1"></i> Answer';
                return;
            }

            // Show loading state
            button.disabled = true;
            button.innerHTML = '<div class="loading-mini"></div> Loading...';

            try {
                // Query API
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to get answer');
                }

                const data = await response.json();

                // Handle the new multi-KB response format
                let answerDisplay = '';
                if (data.results && Array.isArray(data.results)) {
                    if (data.results.length > 0) {
                        // For demo, just show the first result's answer
                        const result = data.results[0];
                        answerDisplay = result.answer || 'No answer found';
                    } else {
                        answerDisplay = 'No results found';
                    }
                } else if (data.answer) {
                    // Fallback for legacy response format
                    answerDisplay = data.answer;
                } else {
                    answerDisplay = 'No answer available';
                }

                // Show answer
                answerText.textContent = answerDisplay;
                answerContent.classList.add('active');
                button.innerHTML = '<i class="fas fa-eye-slash me-1"></i> Hide';

            } catch (error) {
                console.error('Error:', error);
                alert('Error fetching answer. Please try again.');
                button.innerHTML = '<i class="fas fa-search me-1"></i> Answer';
            } finally {
                button.disabled = false;
            }
        }

        // Track if data was stored during this session
        let dataStored = false;

        // Update storeData to set the flag
        const originalStoreData = storeData;
        storeData = async function () {
            await originalStoreData();
            dataStored = true;
        }

        // Clean up demo data when user leaves the page
        window.addEventListener('beforeunload', function (e) {
            if (dataStored) {
                // Use sendBeacon for reliable cleanup on page unload
                const cleanupData = new FormData();
                navigator.sendBeacon('/api/clear-demo', cleanupData);
            }
        });

        // Also clean up when navigating away (for single-page navigation)
        window.addEventListener('pagehide', function (e) {
            if (dataStored) {
                const cleanupData = new FormData();
                navigator.sendBeacon('/api/clear-demo', cleanupData);
            }
        });
    </script>
</body>

</html>
