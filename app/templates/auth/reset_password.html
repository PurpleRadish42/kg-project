{% extends "base.html" %}

{% block title %}Reset Password - Knowledge Graph AI{% endblock %}

{% block content %}
<div class="container" style="max-width: 450px; margin-top: 2rem;">
    <div class="card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h1 class="h3 mb-2">Set New Password</h1>
                <p class="text-muted">Create a new password for <strong>{{ email }}</strong></p>
            </div>

            <form method="POST" id="resetForm">
                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" minlength="6"
                        required autofocus>
                    <div class="form-text">At least 6 characters</div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                        minlength="6" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    Reset Password
                </button>
            </form>

            <div class="text-center">
                <p class="text-muted mb-0">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none"
                        style="color: var(--accent-color);">Back to Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
