{% extends "base.html" %}

{% block title %}Login - Knowledge Graph AI{% endblock %}

{% block extra_head %}
<style>
    .btn-google {
        background: white;
        border: 1px solid #dadce0;
        color: #3c4043;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: var(--font-sans);
        font-weight: 500;
        padding: 11px 24px;
        transition: all 0.2s ease;
        text-decoration: none;
        border-radius: 4px;
    }

    .btn-google:hover {
        background: #f8f9fa;
        border-color: #d2d3d4;
        box-shadow: 0 1px 3px rgba(60, 64, 67, 0.15);
        color: #3c4043;
    }

    .google-icon {
        width: 18px;
        height: 18px;
    }

    .divider-container {
        display: flex;
        align-items: center;
        margin: 1.5rem 0;
    }

    .divider-line {
        flex: 1;
        height: 1px;
        background: #e0e0e0;
    }

    .divider-text {
        padding: 0 1rem;
        color: #8b8680;
        font-size: 0.875rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container" style="max-width: 450px; margin-top: 2rem;">
    <div class="card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h1 class="h3 mb-2">Welcome Back</h1>
                <p class="text-muted">Sign in to your account</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                    <div class="text-end mt-1">
                        <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none"
                            style="color: var(--accent-color); font-size: 0.875rem;">Forgot Password?</a>
                    </div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    Sign in
                </button>
            </form>

            <div class="divider-container">
                <div class="divider-line"></div>
                <span class="divider-text">or</span>
                <div class="divider-line"></div>
            </div>

            <a href="{{ url_for('auth.google_login') }}" class="btn-google w-100 mb-3">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                <span>Continue with Google</span>
            </a>

            <div class="text-center">
                <p class="text-muted mb-0">
                    Don't have an account?
                    <a href="{{ url_for('auth.register') }}" class="text-decoration-none"
                        style="color: var(--accent-color);">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
