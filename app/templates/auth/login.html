{% extends "base.html" %}

{% block title %}Login - Knowledge Graph AI{% endblock %}

{% block content %}
<div class="container" style="max-width: 450px; margin-top: 2rem;">
    <div class="card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h1 class="h3 mb-2">Welcome Back</h1>
                <p class="text-muted">Sign in to your account</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    Sign in
                </button>
            </form>

            <div class="text-center">
                <p class="text-muted mb-0">
                    Don't have an account?
                    <a href="{{ url_for('auth.register') }}" class="text-decoration-none"
                        style="color: var(--accent-color);">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
