{% extends "base.html" %}

{% block title %}Register - Knowledge Graph AI{% endblock %}

{% block content %}
<div class="container" style="max-width: 450px; margin-top: 2rem;">
    <div class="card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h1 class="h3 mb-2">Create Account</h1>
                <p class="text-muted">Join Knowledge Graph AI</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                    <div class="form-text">Choose a unique username</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                    <div class="form-text">At least 6 characters</div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    Create Account
                </button>
            </form>

            <div class="text-center">
                <p class="text-muted mb-0">
                    Already have an account?
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none"
                        style="color: var(--accent-color);">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
