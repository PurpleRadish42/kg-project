{% extends "base.html" %}

{% block title %}Forgot Password - Knowledge Graph AI{% endblock %}

{% block content %}
<div class="container" style="max-width: 450px; margin-top: 2rem;">
    <div class="card">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h1 class="h3 mb-2">Forgot Password?</h1>
                <p class="text-muted">Enter your username or email and we'll send you a code to reset your password.</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="identifier" class="form-label">Username or Email</label>
                    <input type="text" class="form-control" id="identifier" name="identifier" required autofocus>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    Send Reset Code
                </button>
            </form>

            <div class="text-center">
                <p class="text-muted mb-0">
                    Remember your password?
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none"
                        style="color: var(--accent-color);">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
