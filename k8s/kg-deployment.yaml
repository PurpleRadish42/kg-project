apiVersion: apps/v1
kind: Deployment
metadata:
  name: kg-ai-app
  namespace: abhijit
spec:
  selector:
    matchLabels:
      app: kg-ai-app
  template:
    metadata:
      labels:
        app: kg-ai-app
    spec:
      containers:
      - name: kg-ai-app
        image: ghcr.io/purpleradish42/kg-ai:v2
        resources:
          limits:
            memory: "512Mi"
            cpu: "1000m"
          requests:
            memory: "256Mi"
            cpu: "500m"
        ports:
        - containerPort: 9000


---

apiVersion: v1
kind: Service
metadata:
  name: kg-ai-lb
spec:
  selector:
    app: kg-ai-app
  ports:
  - port: 80
    protocol: TCP
    targetPort: 9000

